# docker-compose.yml
# Removed the 'version: '3.8'' line at the top

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://kanban:kanban@db:5432/kanban
      SECRET_KEY: super-secret-production-key
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./hrundel-kanban
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

